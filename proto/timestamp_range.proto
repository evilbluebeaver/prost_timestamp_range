syntax = "proto3";
package timestamp_range;

message TimestampRange {
    // Absent means unbounded.
    optional int64 start = 1;
    // Absent means unbounded.
    optional int64 end = 2;
    // Absent defaults to included.
    optional bool start_is_excluded = 3;
    // Absent defaults to excluded.
    optional bool end_is_included = 4;
}